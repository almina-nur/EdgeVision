services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgevision-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edgevision-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
