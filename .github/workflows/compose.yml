name: Docker Compose smoke test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the default ONNX model
        run: |
          python3 - <<'PY'
          from download_models import MODEL_URLS, download_file

          name = "yolov8n_fp32.onnx"
          assert download_file(MODEL_URLS[name], f"models/{name}")
          PY

      - name: Build and start services
        env:
          EDGEVISION_API_KEY: compose-smoke-key
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120

      - name: Check the dashboard, prediction, database and monitoring
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/health \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["model_loaded"]'
          curl --fail --silent --show-error --max-time 120 \
            -H 'X-API-Key: compose-smoke-key' -F 'file=@assets/test_image.jpg' http://127.0.0.1:3000/api/predict \
            | python3 -c 'import json, sys; result = json.load(sys.stdin); assert result["image_width"] > 0 and isinstance(result["detections"], list)'
          test "$(docker compose exec -T postgres psql -U edgevision -d edgevision -Atc 'SELECT count(*) FROM prediction_logs')" -ge 1
          curl --fail --silent --show-error http://127.0.0.1:5000/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors http://127.0.0.1:3001/api/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors http://127.0.0.1:9090/-/ready >/dev/null
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --get --data-urlencode 'query=up{job="edgevision"}' \
              http://127.0.0.1:9090/api/v1/query \
              | python3 -c 'import json, sys; assert any(row["value"][1] == "1" for row in json.load(sys.stdin)["data"]["result"])'; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
